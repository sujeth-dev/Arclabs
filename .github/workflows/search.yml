name: Production search discovery
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'
permissions:
  contents: read
concurrency:
  group: production-search
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Notify IndexNow after production matches
        if: github.event_name == 'push'
        env:
          PREVIOUS_COMMIT: ${{ github.event.before }}
        run: node scripts/indexnow.mjs --since="$PREVIOUS_COMMIT" --submit --attempts=40
      - name: Install QA dependencies
        run: npm ci --ignore-scripts
      - name: Audit production metadata, redirects and assets
        run: npm run qa:search -- --live
      - name: Retain notification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-receipt
          path: qa/services/indexnow/latest.json
          if-no-files-found: ignore
